[project]
name = "opencivicquery"
version = "0.1.0"
description = "Open, auditable access to government open data for reporters, over MCP"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rongcheng Zhang" }]
requires-python = ">=3.12,<3.15"
dependencies = [
  "google-cloud-storage>=3,<4",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
opencivicquery = "opencivicquery.cli:main"
opencivicquery-server = "opencivicquery.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencivicquery"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
