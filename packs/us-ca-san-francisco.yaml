# San Francisco open data (DataSF). Profiles passed a live schema and unique-key audit
# in August 2026.
pack_id: us-ca-san-francisco
name: San Francisco
platform: socrata
domain: data.sf.gov
checked_on: '2026-08-26'
datasets:
- dataset_id: vw6y-z8j6
  name: 311 Cases
  row_grain: One SF311 service request
  unique_key: service_request_id
  default_time_field: requested_datetime
  geography_fields:
    neighborhood: analysis_neighborhood
    police_district: police_district
    supervisor_district: supervisor_district
  counting_guidance: Use count(*) for service requests. Counts represent requests, not unique underlying
    conditions. For tent or encampment questions, set service_name = 'Encampment'. Do not use substring
    filters on descriptions.
  caveats:
  - Duplicate reports can describe the same underlying condition.
  - Current rows can change after the request is opened.
  - Analysis Neighborhood is the default meaning of a neighborhood name such as Mission.
  - A text search for tent also matches unrelated words such as inattention. Use the Encampment service
    category.
- dataset_id: 5cei-gny5
  name: Eviction Notices
  row_grain: One eviction notice filed with the San Francisco Rent Board
  unique_key: eviction_id
  default_time_field: file_date
  geography_fields:
    neighborhood: neighborhood
  counting_guidance: Count notices. A notice does not establish that an eviction occurred.
  caveats:
  - A filed notice does not necessarily mean that the tenant was evicted.
  - Historical rows can be corrected after publication.
  - Addresses are published at the block level, so a row locates a block rather than a unit.
- dataset_id: f2jc-ivnc
  name: Building Permits Deduplicated on Primary Address
  row_grain: One building permit at its primary address
  unique_key: permit_number
  default_time_field: permit_creation_date
  geography_fields:
    neighborhood: neighborhoods_analysis_boundaries
    supervisor_district: supervisor_district
  counting_guidance: Count permit records in this deduplicated view for permitting trends.
  caveats:
  - Permit creation, filing, approval, issuance, and completion are different events.
  - The current status must be interpreted with the corresponding status dates.
- dataset_id: wg3w-h783
  name: Police Department Incident Reports, 2018 to Present
  row_grain: One unique combination of incident report and incident code
  unique_key: row_id
  default_time_field: incident_datetime
  geography_fields:
    neighborhood: analysis_neighborhood
    police_district: police_district
    supervisor_district: supervisor_district
  counting_guidance: Use count(distinct incident_id) for incident reports. Use count(*) only for incident-code
    occurrences.
  count_distinct_field: incident_id
  count_distinct_unit: distinct incident reports
  caveats:
  - One incident report can appear in multiple rows when it has multiple incident codes.
  - Supplemental reports can add rows for the same incident.
  - Locations are mapped to nearby intersections for privacy.
  - The source can remove or revise records after publication.
- dataset_id: pitq-e56w
  name: Campaign Finance Transactions
  row_grain: One transaction from the current version of a campaign filing
  unique_key: element_nid
  default_time_field: calculated_date
  geography_fields: {}
  counting_guidance: Filter by form_type before aggregating. Use calculated_amount as the source-recommended
    amount field.
  caveats:
  - Different form types represent contributions, expenditures, loans, and other transactions.
  - Amendments replace prior filing versions.
  - Nightly updates can be incomplete between midnight and 8am Pacific time.
  - Some expenditure schedules can describe the same spending and require care to avoid double counting.
- dataset_id: g8m3-pdis
  name: Registered Business Locations - San Francisco
  row_grain: One registered business location associated with one registered business account
  unique_key: ttxid
  geography_fields:
    neighborhood: neighborhoods_analysis_boundaries
  counting_guidance: Use count(*) for registered business locations. When the question asks about businesses
    or accounts, also run count(distinct certificate_number) and call that result distinct registered
    business accounts. Neither unit establishes how many businesses actually closed or when operations
    stopped.
  count_distinct_field: certificate_number
  count_distinct_unit: distinct registered business accounts
  caveats:
  - A registered business account can have multiple locations, and each location appears as a separate
    row.
  - Location End Date and Business End Date are dates in the registration record. Neither field establishes
    when business operations stopped.
  - An administrative closure can mean no filing or communication with the Treasurer and Tax Collector
    for three years, or a closure notification from another City and County department. Do not assign
    every administrative closure to the three-year path.
  - A row without the administrative-closure marker is only an unmarked record. Do not call it an ordinary
    closure or a closer proxy for a business that wound down.
  - The July 6, 2026 Proposition M note documents changes to NAICS fields. It does not establish a change
    to end-date fields or the administrative-closure process.
