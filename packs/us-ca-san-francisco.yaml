  name: Lobbyist Activity Directory
  row_grain: One activity reported by a registered lobbyist on a monthly statement  # official: summary and id description
  unique_key: id  # official: unique id for activity; checked 2026-11-26: 124,020 distinct of 124,020
  default_time_field: date  # official: activity date
