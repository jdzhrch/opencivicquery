# San Francisco open data (DataSF).
# Rule for this pack: every statement comes from DataSF's own dataset or field description
# ("official"), or from a live query on the date shown ("checked"). Nothing is inferred.
# The comment beside each statement names its basis.
pack_id: us-ca-san-francisco
name: San Francisco
platform: socrata
domain: data.sf.gov
checked_on: '2026-10-27'
datasets:
- dataset_id: vw6y-z8j6
  name: 311 Cases
  row_grain: One SF311 service request  # official: summary and service_request_id description
  unique_key: service_request_id  # official: "The unique ID of the service request created"
  default_time_field: requested_datetime  # official: when the service request was made
  geography_fields:
    neighborhood: analysis_neighborhood  # official: SF Analysis Neighborhood
    police_district: police_district
    supervisor_district: supervisor_district
  # checked 2026-10-27: service_name = 'Encampment' matched 106,988 requests.
  counting_guidance: Use count(*) for service requests. For encampment questions, filter service_name
    = 'Encampment'.
  caveats:
  - The dataset holds SF311 cases created since July 1, 2008.  # official: summary
  - status_description shows the request's current state.  # official: field description
  - The dataset updates nightly, with new data added around 6am Pacific.  # official: update process
- dataset_id: 5cei-gny5
  name: Eviction Notices
  row_grain: One eviction notice filed with the San Francisco Rent Board  # official: summary
  unique_key: eviction_id  # checked 2026-10-27: 49,032 rows, 49,032 distinct values
  default_time_field: file_date  # official: date the notice was filed with the Rent Board
  geography_fields:
    neighborhood: neighborhood  # official: analysis neighborhoods
  counting_guidance: Count notices with count(*).  # official: one row is one notice (summary)
  caveats:
  - A notice of eviction does not necessarily indicate that the tenant was eventually evicted.  # official: summary
  - Addresses are published at the block level.  # official: address field description
  - Notices are published since January 1, 1997.  # official: summary
- dataset_id: f2jc-ivnc
  name: Building Permits Deduplicated on Primary Address
  row_grain: One building permit at its primary address  # official: primary address flag filter
  unique_key: permit_number  # checked 2026-10-27: 1,151,389 rows, 1,151,389 distinct values
  default_time_field: permit_creation_date  # official: date the application was created
  geography_fields:
    neighborhood: neighborhoods_analysis_boundaries  # official: analysis neighborhood
    supervisor_district: supervisor_district
  # official: "how to use this dataset" recommends this view for permitting trends.
  counting_guidance: Count permit records with count(*). DBI recommends this primary-address view for
    measuring permitting trends across addresses.
  caveats:
  - Creation, filing, issuance, and completion each have their own date field (permit_creation_date,
    filed_date, issued_date, completed_date).  # official: field descriptions
  - The status field should be read together with the approved, issued, and completed dates.  # official: status field description
  - Permit numbers that start with M are miscellaneous permits, such as street use or address creation.  # official: permit_number description
- dataset_id: wg3w-h783
  name: Police Department Incident Reports, 2018 to Present
  row_grain: One combination of an incident report and an incident code  # official: incident_code description
  unique_key: row_id  # official: unique identifier for each row; checked 2026-10-27: 1,076,581 distinct of 1,076,581
  default_time_field: incident_datetime  # official: when the incident occurred
  geography_fields:
    neighborhood: analysis_neighborhood
    police_district: police_district
    supervisor_district: supervisor_district
  # checked 2026-10-27: 1,076,581 rows for 891,279 distinct incident_id values.
  counting_guidance: Count incident reports with count(distinct incident_id). count(*) counts combinations
    of a report and an incident code.
  count_distinct_field: incident_id  # official: incident IDs uniquely identify reports
  count_distinct_unit: distinct incident reports
  caveats:
  - A single incident report can have one or more incident codes, and each combination is its own row.  # official: incident_code description
  - report_type_description includes Initial, Initial Supplement, Vehicle Initial, Vehicle Supplement,
    Coplogic Initial, and Coplogic Supplement.  # official: field description
  - All incident locations are mapped to nearby intersections. Incidents reported before April 24, 2024
    use a slightly different set of intersections, which may cause slight irregularities across that
    date.  # official: dataset note
  - police_district is entered by officers and is not based on the mapped point.  # official: field description
  - SFPD does not guarantee the accuracy, completeness, timeliness, or sequencing of the data, and may
    remove reports to comply with court orders or for administrative purposes.  # official: summary
- dataset_id: pitq-e56w
  name: Campaign Finance Transactions
  row_grain: One transaction from the most recent version of a filing  # official: summary
  unique_key: element_nid  # official: primary key; checked 2026-11-26: 986,406 distinct of 986,406
  default_time_field: calculated_date  # official: the 'most-appropriate' date for the transaction
  geography_fields: {}
  # official: "how to use" (form_type), the form_type and calculated_amount field descriptions.
  # checked 2026-11-26: 33 form_type values; A (Schedule A, monetary contributions) holds 496,505 rows.
  counting_guidance: Filter by form_type before adding anything up; the source says to use it to tell
    transaction types apart. Letters are Form 460 schedules (A is monetary contributions received);
    other values name the FPPC form. calculated_amount is the amount the source calls most appropriate.
  caveats:
  - The dataset combines transactions from FPPC Forms 460, 461, 496, 497, and 450, across all schedules,
    and includes unitemized totals.  # official: summary
  # official: is_itemized description; checked 2026-11-26: 127,468 rows with is_itemized false, equal
  # to the row total of the *Line2, *Unitemized, F450Line* and F401*Line2 form_type values.
  - Unitemized totals are rows of their own. is_itemized tells itemized and unitemized rows apart, and
    unitemized rows carry form_type values such as F460ALine2.
  - An amendment completely replaces the original filing and any earlier amendments.  # official: how the dataset is created
  # checked 2026-11-26: filing_nid 94f55c38-4d4c-41f1-83b2-fbe7c4a6c3ed has versions 1 and 2 in
  # qizs-bwft; all 84 transaction rows carry version 2 and none carry version 1.
  - Transactions from a superseded version of a filing are not in this dataset; only the current
    version's rows remain.
  - Transactions from rejected filings are not included.  # official: how to use
  - element_nid does not persist between an original filing and its amendment.  # official: field description
  - transaction_id is assigned by the filer, is not necessarily consistent between an original and its
    amendments, and is unique only within a filer.  # official: field description
  # official: field descriptions; checked 2026-11-26: 0 Schedule A rows where calculated_date differs
  # from a non-blank transaction_date.
  - filing_date is the date the filing was submitted. transaction_date is the transaction date, and
    start_date and end_date bound the filing period. For Schedule A rows, calculated_date equalled
    transaction_date wherever transaction_date was filled in.
  # checked 2026-11-26: 154 rows dated after 2026-11-26 (latest 2203-03-07) and 86 rows dated before
  # 1990-01-01 (earliest 1900-09-14).
  - Some calculated_date values lie far outside the filing years. A check on 2026-11-26 found 154 rows
    dated after that day, as late as 2203, and 86 rows dated before 1990, as early as 1900.
  - memo_code marks a memo amount whose date and amount are informational only.  # official: field description; checked 2026-11-26: 3,383 rows true
  # checked 2026-11-26: 5,832 rows with calculated_amount below zero.
  - calculated_amount can be negative.
  - transaction_type flags third-party repayments (T), forgiven loans (F), returned amounts (R),
    intermediaries (I), and transfers (X).  # official: field description
  - filer_name is the committee name at the time of filing; the Filers dataset (4c8t-ngau) holds the
    current name.  # official: filer_name description here and in 4c8t-ngau
  # official: column list and field descriptions (transaction_city, transaction_state, transaction_zip).
  - Contributor addresses carry city, state, and ZIP code only; the dataset has no street address column.
  - district_1222 holds the 2012 to 2022 Board of Supervisors district for the transaction location.  # official: field description
  - The nightly update starts at midnight Pacific, and the source advises viewing or downloading before
    midnight or after 8am because data may be incomplete during the update.  # official: update process
  - Fields copied from the Filings dataset can be blank when the copy fails; such rows join to their
    filing through filing_activity_nid.  # official: update process; checked 2026-11-26: 0 rows blank
- dataset_id: qizs-bwft
  name: Campaign Finance Filings Received
  # official: filing_activity_nid description ("Unique identifier for the submition of a filing
  # (original, amendment, correction)") and filing_type description (Original, Amendment, Correction,
  # Attachment Added); checked 2026-11-26: superseded versions remain as rows.
  row_grain: One submission of a campaign filing (an original, an amendment, a correction, or added
    attachments)
  unique_key: filing_activity_nid  # official: primary key; checked 2026-11-26: 76,695 distinct of 76,695
  default_time_field: filing_date  # official: date the filing was submitted
  geography_fields: {}
  # official: current_status description; checked 2026-11-26: 76,695 rows, 61,259 distinct filing_nid,
  # 60,882 rows with current_status starting "Most Recent", 13,216 starting "Superseded by";
  # checked 2026-11-27: the "Most Recent" rows hold 60,881 distinct filing_nid against 61,259 in all.
  counting_guidance: count(*) counts submissions, including superseded versions. To count filings with
    each original and its amendments once, use count(distinct filing_nid). Keeping only rows whose
    current_status starts with "Most Recent" gives a smaller count, about 380 filings fewer in a
    check, so do not mix the two methods in one comparison. Filter form_type to the forms you mean.
  count_distinct_field: filing_nid  # official: unique identifier for the filing
  # official: filing_nid and current_status descriptions
  count_distinct_unit: distinct filings (an original and its amendments count once)
  caveats:
  - Campaign forms include FPPC forms 410, 450, 460, 461, 465, 470, 496, and 497, and SFEC forms 161,
    162, and 163 are also recorded.  # official: summary
  # checked 2026-11-26: 30 form_type values, including FPPC490 (2,999 rows), FPPC501 (1,951), and
  # FPPC420 (1,511).
  - Live data also holds form types the summary does not list, such as FPPC490, FPPC501, and FPPC420.
  - Filings received on paper do not have corresponding data in the Transactions or Summary datasets.  # official: how to use
  - Amendment filings supersede all transactions from the original filing and any prior amendments.  # official: how to use
  - current_status gives the superseding filing if a filing is superseded, and a blank value means an
    error during the sync update.  # official: field description; checked 2026-11-26: 1,929 rows blank
  # checked 2026-11-26: 252 rows read "This electronic filing was submitted less than 7 days prior to a
  # paper filing ..."; other rows read "This filing is the most recent amendment, but was submitted on
  # paper within 7 days of an electronic filing ...". checked 2026-11-27: the full text says the filing
  # covers the same period and names the filing whose data "is represented in the summary and
  # transaction datasets".
  - When a paper and an electronic filing for the same period arrive within 7 days, current_status says
    which filing's data the Summary and Transactions datasets represent.
  - A rejected filing is usually one made in error, under the wrong filing account, or with an error in
    the reporting period; many are later rectified by a revised statement.  # official: how to use and rejected description; checked 2026-11-26: 164 rows true
  - rendering_url is the URL of a PDF rendering of the filing, if available.  # official: field description
  # checked 2026-11-26: GET on two netfile.com/Connect2/api/public/image/<filing_id_number> URLs (one
  # electronic, one paper filing) returned HTTP 200 application/pdf; 36,718 rows have no rendering_url
  # (36,323 paper); 1,496 AttachmentsAdded rows point to public.netfile.com/Pub2/AllFilingsByFiler.aspx.
  - Both rendering_url links tested, of the form netfile.com/Connect2/api/public/image/<filing_id_number>,
    returned the filing's PDF. Most paper filings have no rendering_url, and rows that only add
    attachments link to a NetFile web page instead of a PDF.
  - filer_name is the committee name at the time of filing; committees can change names.  # official: how to use
  - fppc_id may be 'Pending' or blank if the committee has not yet received its id from the California
    Secretary of State.  # official: field description
  - filing_datetime records paper filings as midnight Pacific time on the filing date.  # official: field description
  # checked 2026-11-26: earliest filing_date 1975-07-31 (paper FPPC420 rows).
  - filing_date reaches back to 1975 for paper filings.
  - The nightly update starts at midnight Pacific, and the source advises viewing or downloading before
    midnight or after 8am.  # official: update process
- dataset_id: 4c8t-ngau
  name: Campaign Finance San Francisco Campaign Filers
  # official: summary and filer_nid description.
  row_grain: One campaign committee or non-committee campaign finance filer in the Ethics Commission's
    records database, active or terminated
  unique_key: filer_nid  # official: primary key; checked 2026-11-26: 5,318 distinct of 5,318
  geography_fields: {}
  # checked 2026-11-26: 5,318 rows, 3,571 distinct fppc_id, 645 rows with fppc_id blank or 'Pending'.
  counting_guidance: count(*) counts filers. Filter on status or is_terminated before counting active
    committees, and on filer_type for a kind of filer.
  caveats:
  - The nightly script replaces the dataset with a complete list of all filers.  # official: update process
  - filer_name is the most current version of a committee name as registered with the Ethics
    Commission.  # official: how to use
  - Committees are generally only required to register with the Ethics Commission if they participate
    in local elections.  # official: how to use
  - fppc_id may appear as 'pending' until the committee files a courtesy copy of its Secretary of State
    registration with the Ethics Commission.  # official: how to use
  # checked 2026-11-26: status values ACTIVE, ANNUAL, TERMINATED, NR, NONSF; 2 rows ACTIVE with
  # is_terminated true. official: the status description ("Status of committee") defines no codes.
  - status holds codes the dataset does not define (NR, NONSF, ANNUAL), and a few ACTIVE rows have
    is_terminated set to true.
  - is_terminated tells whether the filer is terminated as of the data_as_of date.  # official: field description
- dataset_id: 9ggq-m8hp
  name: Campaign Finance Summary Totals
  row_grain: One electronically filed FPPC Form 450, 460, 461, or 465, with the figures from its summary
    page  # official: summary and filing_nid description
  unique_key: filing_nid  # official: primary key; checked 2026-11-26: 17,935 distinct of 17,935
  geography_fields: {}
  # official: line descriptions; checked 2026-11-26: FPPC460 15,780 rows, FPPC461 1,486, FPPC465 632,
  # FPPC450 37.
  counting_guidance: Filter form_type before reading any line, because each line column means different
    things on different forms. On Form 460, column A is this period and column B is calendar year to
    date.
  caveats:
  - Transactions from rejected and superseded filings are not included.  # official: how to use
  - If a committee files an amendment, its data completely replaces the original and earlier amendments.  # official: how the dataset is created
  - A row with no sync_flag value most likely means the latest filing was submitted on paper and amended
    an electronic filing; the Ethics Commission is working on how to handle these cases.  # official: how to use and sync_flag description; checked 2026-11-26: 129 rows blank
  - Paper filings have no data in this dataset.  # official: qizs-bwft how to use
  - start_date and end_date bound the filing period; filing_date is when the filing was submitted.  # official: field descriptions
  - The nightly update starts at midnight Pacific, and the source advises viewing or downloading before
    midnight or after 8am.  # official: update process
