# New York City Open Data.
# Rule for this pack: every statement comes from the agency's own dataset or field description
# ("official"), or from a live query on the date shown ("checked"). Nothing is inferred.
# The comment beside each statement names its basis.
pack_id: us-ny-new-york-city
name: New York City
platform: socrata
domain: data.cityofnewyork.us
checked_on: '2026-10-27'
datasets:
- dataset_id: 43nn-pn8j
  name: DOHMH New York City Restaurant Inspection Results
  # official: dataset description (violation citations; no-violation inspections and
  # not-yet-inspected restaurants appear as single rows).
  row_grain: One violation citation from one inspection. An inspection with no violations, and a restaurant
    not yet inspected, each appear as a single row.
  default_time_field: inspection_date  # official: date of inspection
  geography_fields:
    borough: boro  # official: borough of the establishment
    zip: zipcode  # official: zip code of the establishment
  count_distinct_field: camis  # official: unique identifier, static per restaurant permit
  count_distinct_unit: restaurants (permits)
  # official: CAMIS description; 1/1/1900 marks an establishment not yet inspected.
  # checked 2026-10-27 across all rows: 04K descriptions are evidence of rats; 04L and 04M are evidence of mice.
  counting_guidance: Rows are violation citations. Count restaurants with count(distinct camis). Exclude
    inspection_date = '1900-01-01T00:00:00', which marks an establishment not yet inspected. Rats are
    violation_code '04K'; mice are '04L' and '04M'.
  caveats:
  - When an inspection results in more than one violation, the inspection's fields, including score and
    grade, repeat on each violation row.  # official: dataset description
  - Only restaurants in an active status on the record date are included.  # official: dataset description
  - Each restaurant's records cover inspections up to three years before its most recent inspection.  # official: dataset description
  - score is the inspection's total score and is updated after adjudication. The Health Department says
    the lower the score, the better the grade.  # official: score field; nyc.gov restaurant grades page
  - Critical violations are those most likely to contribute to foodborne illness.  # official: critical_flag description
  - The dataset has no field with the point value of each violation.  # checked 2026-10-27: schema
  - Checked on 2026-10-26, initial cycle inspections carry only grade A, with scores 0 to 13, while graded
    re-inspections show scores that span several grades (grade A up to 27, grade C as low as 21). Use
    the grade field, and do not derive a grade from a score.  # checked 2026-10-26: grade by score range
  - N, Z, and P mean not yet graded, grade pending, and grade pending issued on reopening after a closure.  # official: grade description
  - 303 rows have a boro value of '0', which the field description does not define.  # checked 2026-10-27
  - The source warns of illogical values from data entry or transfer errors, and of missing data.  # official: dataset description
- dataset_id: erm2-nwe9
  name: 311 Service Requests from 2020 to Present
  row_grain: One NYC311 service request that can be directed to a specific agency, created in 2020 or
    later  # official: dataset description
  unique_key: unique_key  # official: unique identifier of a service request
  default_time_field: created_date  # official: date the request was created
  geography_fields:
    borough: borough  # official
    community_board: community_board  # official
    council_district: council_district  # official
    police_precinct: police_precinct  # official
    zip: incident_zip  # official
  # checked 2026-10-27: descriptors under complaint_type 'Rodent' were Rat Sighting, Condition Attracting
  # Rodents, Signs of Rodents, Mouse Sighting, and Rodent Bite - PCS Only.
  counting_guidance: Use count(*) for service requests. complaint_type 'Rodent' holds the descriptors
    Rat Sighting, Condition Attracting Rodents, Signs of Rodents, Mouse Sighting, and Rodent Bite - PCS
    Only; filter on descriptor to separate them.
  caveats:
  - Requests from 2010 to 2019 are in a separate dataset, 311 Service Requests from 2010 to 2019 (76ig-c548).  # official: dataset description
  - Complaint types are defined by the responding agencies, and new ones may be added.  # official: complaint_type description
  - The dataset is updated daily, and expected values for many fields will change over time.  # official: dataset description
- dataset_id: 6z8x-wfk4
  name: Evictions
  row_grain: One eviction executed by a New York City Marshal, 2017 or later  # official: dataset description
  default_time_field: executed_date  # official: date the eviction was executed
  geography_fields:
    borough: borough  # official
    community_board: community_board  # official
    council_district: council_district  # official
    nta_code: nta  # official: Neighborhood Tabulation Area
    zip: eviction_zip  # official
  # official: docket_number is "assigned by the City Marshal upon case intake".
  # checked 2026-10-26: docket 108472 appeared on 5 rows with 5 different marshals and 5 dates.
  counting_guidance: Count executed evictions with count(*). residential_commercial_ind takes the values
    Residential and Commercial; filter on Residential for housing evictions. Do not count distinct docket_number
    values, because the same docket number appears on rows with different marshals and dates.
  caveats:
  - The dataset lists executed evictions in the five boroughs from 2017 on. Data before January 1, 2017
    is not available.  # official: dataset description
  - The data is compiled from New York City Marshals.  # official: dataset description
  - eviction_possession separates an eviction, where the tenant and property are removed, from a legal
    possession, where the tenant is removed and the property stays with the landlord as bailee. On 2026-10-27,
    132,849 of 136,185 rows were possessions.  # official: field description; checked 2026-10-27
- dataset_id: jz4z-kudi
  name: OATH Hearings Division Case Status
  # official: dataset description ("The summonses listed in this dataset are issued and filed at the
  # OATH Hearings Division by City enforcement agencies").
  # checked 2026-11-20: 22,253,488 rows and 22,253,488 distinct ticket_number values.
  row_grain: One summons that a City enforcement agency issued and filed at the OATH Hearings Division, with
    its charges, hearing status, decision, and amounts.
  unique_key: ticket_number  # checked 2026-11-20: unique on every row
  default_time_field: violation_date  # official: column name Violation Date
  geography_fields:
    borough: violation_location_borough  # official: column name Violation Location (Borough)
    zip: violation_location_zip_code  # official: column name Violation Location (Zip Code)
  # checked 2026-11-20: charge_2_code was filled on 2,806,472 rows and charge_10_code on 744,950 rows;
  # 42,768 rows had violation_date 1900-01-01.
  counting_guidance: Count summonses with count(*). One summons can list up to ten charges in charge_1_code
    through charge_10_code, so a count of one charge code must check all ten columns. For counts by date,
    exclude violation_date = '1900-01-01T00:00:00' and empty dates. Each summons has one row, so the dataset
    holds one hearing_status and one hearing_result per summons and keeps no earlier statuses.
  caveats:
  - The dataset covers alleged public safety and quality of life violations that City enforcement agencies
    file at the OATH Hearings Division.  # official: dataset description
  - Cases at the OATH Trials Division are in a separate dataset, OATH Trials Division Case Status
    (y3hw-z6bm).  # checked 2026-11-20: catalog search
  - As of May 4, 2026, the dataset no longer includes the respondent first name or the street name, city,
    and state of the respondent address. The agency points to the OATH Summons Finder for those details.  # official: dataset description
  - The dataset is updated daily.  # official: portal metadata, Update Frequency
  - The portal metadata has no field descriptions for this dataset. The agency attaches a data dictionary
    file to the dataset page.  # checked 2026-11-20: schema and attachments
  - The amount fields (total_violation_amount, penalty_imposed, paid_amount, balance_due, and
    additional_penalties_or_late_fees) have no field descriptions. Ask OATH what each one includes before
    adding them up.  # checked 2026-11-20: schema
  - On 2026-11-20, 42,768 rows had violation_date 1900-01-01, 74 more fell before 1980, and 20 fell after
    that day (the latest in the year 5201). Most rows fall in 1990 or later.  # checked 2026-11-20
  - On 2026-11-20, 3,226,007 rows had violation_location_borough 'NOT NYC' and 16,089 rows had none.  # checked 2026-11-20
  - On 2026-11-20, issuing_agency was empty on 3,761,717 rows and held similar labels such as 'POLICE
    DEPARTMENT' (463,862 rows) and 'POLICE DEPT' (62,771 rows). List every label before you filter on one.  # checked 2026-11-20
  - On 2026-11-20, hearing_result was empty on 9,185,911 rows and held at least 50 labels, among them
    'SUSTAINED' and 'Sustained', and 'DEFAULT', 'DEFAULTED', and 'Default/ No Appearance'. The portal
    metadata does not define them. Group by the field and name each label that a figure combines.  # checked 2026-11-20
- dataset_id: 59kj-x8nc
  name: Housing Litigations
  # official: dataset description and the litigationid description ("Unique number identifying the case").
  # checked 2026-11-20: 242,293 rows and 242,293 distinct litigationid values.
  row_grain: One case of the HPD Housing Litigation Division. The division brings Housing Court actions
    against owners of privately owned buildings and represents HPD when tenants start actions against
    private owners.
  unique_key: litigationid  # official: unique number identifying the case; checked 2026-11-20: unique on every row
  default_time_field: caseopendate  # official: date the case was opened
  geography_fields:
    borough: boroid  # official: identifier of the borough
    zip: zip  # official: zip code for the property
    community_district: community_district  # official: column name Community District
    council_district: council_district  # official: column name Council District
    nta_name: nta  # official: column name NTA; checked 2026-11-20: values are names such as Gramercy
  count_distinct_field: buildingid  # official: unique identifier of building
  count_distinct_unit: distinct buildings
  # checked 2026-11-20: 74,062 distinct buildingid values; casetype 'Tenant Action' had 111,974 rows and
  # 'Heat and Hot Water' 60,923; 6,779 rows had casestatus 'PENDING'; all 2,750 'CONH' rows, and only
  # those rows, had a casestatus other than CLOSED or PENDING, in 1,598 distinct labels.
  counting_guidance: Count cases with count(*) and buildings with count(distinct buildingid). Group or
    filter by casetype to separate kinds of case, such as 'Tenant Action' and 'Heat and Hot Water'. For
    counts by year, use caseopendate and exclude empty values. casestatus is CLOSED or PENDING on every row
    except the casetype 'CONH' rows, which hold labels such as 'GRANTED - 10/20/2006'.
  caveats:
  - Actions that tenants start against private owners are included, because HPD is automatically named as
    a party. Two casetype labels name tenant actions, 'Tenant Action' (111,974 rows on 2026-11-20) and
    'Tenant Action/Harrassment' (23,281 rows), so a filter on one label leaves out the other. Name each
    label a figure includes.  # official: dataset description; checked 2026-11-20
  - The dataset is updated monthly.  # official: portal metadata, Update Frequency
  - On 2026-11-20, caseopendate fell in 2004 on 995 rows and in 2005 on 8,103 rows. 9 rows had earlier
    dates, among them the years 204, 1914, and 1930; 2 rows were dated 2030; 298 rows had no date.  # checked 2026-11-20
  - casejudgement (shown as OpenJudgement) is described as the final judgment, if any, for the case. On
    2026-11-20 it held only YES (3,671 rows) and NO (238,622 rows).  # official: field description; checked 2026-11-20
  - findingofharassment has no field description. On 2026-11-20 it held 'No Harassment' (8,200 rows),
    'After Inquest' (256), and 'After Trial' (81), and 8,535 of its 8,537 filled rows had casetype
    'Tenant Action/Harrassment'. Ask HPD what each value means before you report it.  # checked 2026-11-20
  - penalty and findingdate have no field descriptions. On 2026-11-20 they were filled on 337 and 335
    rows.  # checked 2026-11-20
  - boroid holds the codes 1 to 5, and its field description does not name the boroughs. community_district
    holds the numbers 1 to 18 with no borough prefix, and every borough has a district 1, so group it with
    boroid.  # official: boroid description; checked 2026-11-20
